<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Seria – planer treningowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* Layout: aplikacja mobilna – lepki nagłówek, przewijana treść, dolny pasek zakładek, arkusze od dołu.
   Paleta „żelazo i talerze”: grafitowe neutralne + pomarańczowo-czerwony akcent jak talerz 25 kg. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F3F5F7; --line:#D9DEE5;
  --ink:#10151C; --muted:#5B6573; --accent:#E2471B; --accent-ink:#FFFFFF; --accent-soft:#FCE3D9;
  --blue:#1E5BD0; --good:#178A4E; --good-soft:#DDF3E6; --warn:#B07800;
  --shadow:0 1px 2px rgba(16,21,28,.06),0 6px 20px rgba(16,21,28,.06);
  --font-d:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151A21; --surface-2:#1C222B; --line:#28303B;
    --ink:#ECF0F4; --muted:#8D97A5; --accent:#FF6633; --accent-ink:#FFFFFF; --accent-soft:#3A1D12;
    --blue:#6A96FF; --good:#3CC97F; --good-soft:#12301F; --warn:#E3AD2E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151A21; --surface-2:#1C222B; --line:#28303B;
  --ink:#ECF0F4; --muted:#8D97A5; --accent:#FF6633; --accent-ink:#FFFFFF; --accent-soft:#3A1D12;
  --blue:#6A96FF; --good:#3CC97F; --good-soft:#12301F; --warn:#E3AD2E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--blue)}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:32px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;font-size:24px;letter-spacing:.08em}
.brand i{width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 7px var(--bg);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--good)} .pill.err .dot{background:var(--warn)}
.pill.live{color:var(--ink);border-color:var(--accent)} .pill.live .dot{background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

main{padding:4px 16px 16px;display:flex;flex-direction:column;gap:18px}
.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.eyebrow{font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.hero{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--font-d);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:#C73A2A}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:active{background:var(--surface-2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.acc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-weight:500;opacity:.75}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.tier{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:6px;font-family:var(--font-d);font-weight:700;font-size:15px;color:#fff;background:var(--muted)}
.tier.S{background:var(--accent)} .tier.A{background:var(--blue)} .tier.B{background:#7C8693} .tier.C{background:#A3ABB5}

.gpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:56px}
.gbtn b{font-weight:600;font-size:15px}
.gbtn span{font-size:12.5px;color:var(--muted)}
.gbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)} .gbtn.on span{color:inherit;opacity:.75}
.gbtn .fresh{color:var(--good)} .gbtn.on .fresh{color:inherit}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);padding:4px 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.exlist{display:flex;flex-direction:column}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.exrow:first-child{border-top:0}
.thumb{width:64px;height:48px;border-radius:9px;object-fit:cover;background:#0b0d10;flex:none}
.exrow .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exrow .meta b{font-weight:600;font-size:15px;line-height:1.25}
.exrow .meta span{font-size:13px;color:var(--muted)}
.exrow .side{display:flex;align-items:center;gap:6px;flex:none}

.dayrow{display:flex;gap:12px;align-items:stretch}
.daytag{width:46px;height:58px;align-self:flex-start;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-d)}
.daytag b{font-size:20px;line-height:1}
.daytag span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.daytag.today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .daytag.today span{color:inherit}
.dayrow .card{flex:1;padding:12px 14px;gap:8px}
.rest-day{flex:1;display:flex;align-items:center;padding:12px 14px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:14px}

/* aktywny trening */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.wcard.complete{border-color:var(--good)}
.wc-head{display:flex;gap:12px;align-items:flex-start}
.wc-head .thumb{width:72px;height:54px}
.hint{font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.hint.up{background:var(--good-soft)} .hint.up b{color:var(--good)}
.sets{display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:8px;align-items:center}
.set-row.head{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.set-row.head span:nth-child(2),.set-row.head span:nth-child(3){padding-left:12px}
.set-row .n{font-family:var(--font-d);font-weight:700;font-size:19px;text-align:center;color:var(--muted)}
.set-row input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.set-row input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.set-row input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.check{width:50px;height:46px;border-radius:10px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface)}
.set-row.done input{background:var(--good-soft);border-color:transparent}
.set-row.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set-row.done .n{color:var(--good)}
.wc-foot{display:flex;gap:8px;flex-wrap:wrap}
.warm{font-size:13px;color:var(--muted)}
.warm b{color:var(--ink);font-weight:600}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.bar .track{position:relative;height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.bar .fill.ok{background:var(--good)}
.bar .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface));border-color:transparent}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface));border-color:transparent}
.heat i.l3{background:var(--accent);border-color:transparent}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}

/* animowana ilustracja */
.demo{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#0b0d10}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img.b{animation:flip 2.6s ease-in-out infinite}
.demo.paused img.b{animation-play-state:paused}
.demo .lbl{position:absolute;left:10px;bottom:10px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.frames{display:none;grid-template-columns:1fr 1fr;gap:6px}
@media (prefers-reduced-motion: reduce){
  .demo{display:none} .frames{display:grid}
  *{animation:none!important;transition:none!important}
}
.frames figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#0b0d10;aspect-ratio:4/3}
.frames img{width:100%;height:100%;object-fit:contain}
.frames figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:5px}

.wustep{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.wunum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:16px}
.wurow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.wurow .thumb{width:56px;height:42px}
.wurow .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wurow .meta b{font-weight:600;font-size:14.5px;line-height:1.25}
.wurow .meta span{font-size:12.5px;color:var(--muted)}
.wurow.done .meta b{color:var(--muted);text-decoration:line-through}
.check.sm{width:44px;height:40px}
.wurow.done .check{background:var(--good);border-color:var(--good);color:#fff}
.wucard>summary{list-style:none;cursor:pointer}
.wucard>summary::-webkit-details-marker{display:none}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:15px}
ol.steps li::before{content:counter(s);font-family:var(--font-d);font-weight:700;font-size:16px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
ul.dots{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.why{border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:14.5px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* timer przerwy */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));z-index:45;width:min(528px,calc(100% - 24px));
  display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
.rest.show{display:flex}
.rest .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest .t{font-family:var(--font-d);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;min-width:74px}
.rest .lab{font-size:12px;opacity:.7;line-height:1.2}
.rest button{min-width:44px;height:40px;border-radius:10px;background:rgba(127,127,127,.22);color:inherit;font-weight:700;font-size:14px;padding:0 10px}
.rest.over{background:var(--accent);color:#fff}

/* arkusz */
.backdrop{position:fixed;inset:0;background:rgba(5,8,12,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:min(560px,100%);max-height:90%;overflow:auto;transform:translate(-50%,105%);transition:transform .25s ease;
  background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet.show{transform:translate(-50%,0)}
.sheet>*{flex-shrink:0}
a.btn{text-decoration:none;color:var(--ink)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0;flex:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:-8px;background:var(--bg);padding-top:8px;z-index:2}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .25s;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;width:100%}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{height:110px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.search{position:relative}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search .inp{padding-left:42px}

.plates{display:flex;align-items:center;justify-content:center;gap:3px;padding:18px 0;min-height:150px}
.plates .sleeve{width:44px;height:16px;background:#9AA3AE;border-radius:3px}
.plates .collar{width:10px;height:34px;background:#6E7782;border-radius:2px}
.plate{width:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--font-d);font-weight:700;font-size:13px;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.p25{height:140px;background:#D7261E}.p20{height:140px;background:#1E56C8}.p15{height:124px;background:#E4B400;color:#1b1b1b}.p10{height:108px;background:#1F8C3C}
.p5{height:84px;background:#F2F2F2;color:#222}.p2_5{height:66px;background:#C62A1F;width:16px}.p1_25{height:56px;background:#B9C0C8;color:#222;width:14px}.p0_5{height:44px;background:#9BA3AD;width:10px}

svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}

.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:14px}
.sum-big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum-big b{display:block;font-family:var(--font-d);font-size:30px;line-height:1}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.fresh{background:var(--good-soft);color:var(--good)}
.st.partial{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.st.tired,.st.today{background:var(--surface-2);color:var(--muted)}
.sg-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.sg-row:first-child{border-top:0}
.sg-row .sets{white-space:nowrap;font-family:var(--font-d);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
.sg-row .sets small{font-family:var(--font-b);font-size:12px;font-weight:500;color:var(--muted)}
.warnbox{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px}
.pr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.pr svg{color:var(--accent)}
details.more>summary{cursor:pointer;list-style:none;font-weight:600;font-size:14px;color:var(--blue)}
details.more>summary::-webkit-details-marker{display:none}
.src li{font-size:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
.kbd{font-variant-numeric:tabular-nums;font-weight:600}

/* wprowadzenie (kreator) */
.ob{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:none;overscroll-behavior:contain}
.ob.show{display:block}
.ob-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-prog{flex:1;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.ob-prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.ob-body{flex:1;display:flex;flex-direction:column;gap:16px}
.ob-foot{display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px}
.ob h1{font-size:34px}
.ob .lead{font-size:16px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:1fr 22px;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt b{display:block;font-weight:600;font-size:16px}
.opt span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.on i{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inp.big{height:56px;font-size:22px;font-weight:600;font-family:var(--font-d);letter-spacing:.02em}
.unit{position:relative}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.hello{display:flex;flex-direction:column;gap:10px;padding:18px 0 4px}
.hello .logo{width:64px;height:64px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 16px var(--accent),inset 0 0 0 21px var(--bg)}
.feat{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center}
.feat .ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.feat .ico svg{width:20px;height:20px}

/* asystent */
.kcal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kcal b{font-family:var(--font-d);font-weight:700;font-size:52px;line-height:.95;font-variant-numeric:tabular-nums}
.kcal span{font-family:var(--font-d);font-size:20px;font-weight:600;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macro{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.macro b{font-family:var(--font-d);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.macro span{font-size:12.5px;color:var(--muted)}
.macro .mb{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.macro .mb i{display:block;height:100%;border-radius:3px}
.minis{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.minis b{color:var(--ink);font-weight:600}
.daybar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.daybar b{font-family:var(--font-d);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.daybar .grow{display:flex;flex-direction:column;gap:1px}
.okbox{border-left:3px solid var(--good);background:var(--good-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px}

/* czat AI */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a p+p,.msg.a p+ul,.msg.a ul+p{margin-top:8px}
.msg.a ul{margin:6px 0 0;padding-left:18px}
.msg.a.wait{color:var(--muted)}
.msg.err{border-color:var(--warn)}
.chat-in{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:-20px;background:var(--bg);padding:8px 0 4px}
.chat-in textarea{flex:1;min-height:46px;max-height:140px;height:46px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 12px;font-size:16px;font-family:var(--font-b)}
.chat-in textarea:focus{outline:none;border-color:var(--accent)}
.chat-in .btn{min-width:46px;padding:0 14px}
.qchips .chip{font-size:13.5px;min-height:34px;text-align:left}
</style>
</head>

  days.forEach(d => d.items.forEach(it => { const e = EXM[it.ex]; if (!e || e.cardio) return; v[e.g] += it.sets; e.s.forEach(s => v[s] += secF(s) * it.sets); }));

function customSession(groups, dur, filter, needIn, boost){
  const p = S.profile;
  const withCardio = p.cardio && dur >= 45;
  const budget = budgetFor(dur - (withCardio ? cardioMins(p, dur) : 0), p.goal);
  const lv = p.level - 2;
  const need = {};
  if (needIn) groups.forEach(g => need[g] = needIn[g]);
  else {
    groups.forEach(g => need[g] = (({big:7, med:6, small:4})[GN[g].size] + lv) * ((boost && boost[g]) || 1));
    const sum = groups.reduce((a, g) => a + need[g], 0);
    const fill = budget * 0.85;
    const f = sum > budget ? budget / sum : sum < fill ? fill / sum : 1;
    groups.forEach(g => need[g] = Math.max(2.5, need[g] * f));
  }
  const cap = clamp(Math.floor(budget / groups.length), 2, 4);
  const nBig = groups.filter(g => GN[g].size === "big").length;
  const capBig = cap * groups.length + nBig <= budget ? Math.min(4, cap + 1) : cap;
  const r = buildSession({groups, need, p, rnd:mulberry32(now() % 100000), usedWeek:new Map(), budget, maxEx:groups.length > 6 ? 10 : 8, secCredit:0, filter, capSets:boost ? cap + 1 : cap, capBig:capBig, minFill:needIn ? 0 : undefined, exact:!!needIn});
  if (withCardio) { const c = cardioItem(p, now() % 7, dur); if (c) r.items.push(c); }
  return r.items;
}

function sessionsSorted(){ return Object.values(S.sessions).filter(s => !s.del).sort((a, b) => b.date.localeCompare(a.date)); }
function doneSets(item){ return (item.sets || []).filter(s => s.done !== false); }
function e1rm(w, r){ if (!w || !r) return 0; return w * (1 + Math.min(r, 12) / 30); }
function lastPerf(exId, beforeIso){
  for (const s of sessionsSorted()) {
    if (beforeIso && s.date >= beforeIso) continue;
    const it = s.items.find(i => i.ex === exId);
    if (it && it.sets.length) return {s, item:it};
  }
  return null;
}
function incFor(e){ if (e.eq.includes("hantle") && !e.bar) return 2; return 2.5; }
function suggest(exId, reps){
  const e = EXM[exId]; const lp = lastPerf(exId);
  const note = S.notes[exId];
  if (e && e.cardio) return lp ? {w:null, msg:`Ostatnio (${fdateS(lp.s.date)}): ${perfLine(lp.item.sets, e)}. <b>Tempo, w którym możesz mówić pełnymi zdaniami.</b>`} : {w:null, msg:`<b>Tempo umiarkowane:</b> możesz mówić, ale nie śpiewać. Wpisz minuty, a jeśli chcesz – dystans w km.`};
  if (!lp) return note && note.w !== null && note.w !== undefined ? {w:note.w, msg:`Twój zapisany ciężar: <b>${fmt(note.w)} kg</b>`} : null;
  const sets = lp.item.sets;
  const top = Math.max(0, ...sets.map(s => s.w || 0));
  const lastLine = `Ostatnio (${fdateS(lp.s.date)}): ` + perfLine(sets, e);
  if (e.time) { const best = Math.max(...sets.map(s => s.r || 0)); return {w:top || null, msg:`${lastLine}. <b>Spróbuj ${best + 5} s.</b>`}; }
  const working = sets.filter(s => (s.w || 0) >= top * 0.9);
  const hi = reps[1], lo = reps[0];
  const allTop = working.length > 0 && working.every(s => (s.r || 0) >= hi);
  if (e.bw && !top) return {w:null, up:allTop, msg:`${lastLine}. <b>${allTop ? "Górny zakres zaliczony – dodaj obciążenie albo trudniejszą wersję." : "Dołóż po 1 powtórzeniu w serii."}</b>`};
  if (allTop) { const nw = top + incFor(e); return {w:nw, up:true, msg:`${lastLine}. <b>Górny zakres zaliczony – dziś ${fmt(nw)} kg.</b>`}; }
  const low = working.some(s => (s.r || 0) < lo);
  return {w:top, msg:`${lastLine}. <b>${low ? `Zostań przy ${fmt(top)} kg i dobij do ${lo} powt.` : `${fmt(top)} kg – dołóż po 1 powtórzeniu.`}</b>`};
}
function perfLine(sets, e){
  if (e && e.cardio) { const m = sets.reduce((a, s) => a + (num(s.r) || 0), 0), km = sets.reduce((a, s) => a + (num(s.w) || 0), 0); return `${m} min${km ? ` · ${fmt(km, 2)} km` : ""}`; }
  const ws = [...new Set(sets.map(s => s.w || 0))];
  const unit = e && e.time ? " s" : "";
  if (ws.length === 1) return (ws[0] ? `${fmt(ws[0])} kg × ` : "") + sets.map(s => (s.r ?? "–") + unit).join(" · ");
  return sets.map(s => `${s.w ? fmt(s.w) : "–"}×${s.r ?? "–"}${unit}`).join(" · ");
}
function bestOf(exId, beforeIso){
  let best = null;
  for (const s of Object.values(S.sessions)) {
    if (s.del || (beforeIso && s.date >= beforeIso) || isCardio(exId)) continue;
    for (const it of s.items) if (it.ex === exId) for (const st of it.sets) {
      const e = EXM[exId];
      const v = (e && (e.bw && !st.w || e.time)) ? (st.r || 0) : e1rm(st.w, st.r);
      if (v && (!best || v > best.v)) best = {v, w:st.w, r:st.r, date:s.date};
    }
  }

}
function weekStats(offset = 0){
  const mon = mondayOf(new Date()); mon.setDate(mon.getDate() + offset * 7);
  const end = new Date(mon); end.setDate(end.getDate() + 7);
  const list = sessionsSorted().filter(s => { const d = new Date(s.date); return d >= mon && d < end; });
  const sets = {}; ALL_G.forEach(g => sets[g] = 0);
  let vol = 0, n = 0, cardio = 0;
  list.forEach(s => s.items.forEach(it => { const e = EXM[it.ex]; if (!e) return; if (e.cardio) { cardio += it.sets.reduce((a, st) => a + (st.r || 0), 0); return; } const k = it.sets.length; n += k; sets[e.g] += k; e.s.forEach(x => sets[x] += secF(x) * k); it.sets.forEach(st => vol += (st.w || 0) * (st.r || 0)); }));

function lastTrained(){
  const out = {};
  for (const s of sessionsSorted()) for (const it of s.items) { const e = EXM[it.ex]; if (e && !e.cardio && !out[e.g]) out[e.g] = s.date; }

}
/* ===================== REGENERACJA I SUGESTIA NASTĘPNEGO TRENINGU ===================== */
const REG = {klatka:"push", barki:"push", triceps:"push", plecy:"pull", biceps:"pull", przedramiona:"pull", czworoglowe:"legs", dwuglowe:"legs", posladki:"legs", przywodziciele:"legs", lydki:"legs", brzuch:"any"};
const ST_TXT = {fresh:"Wypoczęta", partial:"Regeneruje się", tired:"Odpoczywa", today:"Ćwiczona dziś"};
// ref = dzień, dla którego liczymy (dziś albo jutro)
function recovery(ref){
  ref = ref || new Date();
  const st = {};
  ALL_G.forEach(g => st[g] = {last:null, dd:null, d:[0,0,0,0], sec:[0,0,0,0], week:0});
  for (const s of sessionsSorted()) {
    const dd = daysBetween(s.date, ref);
    if (dd < 0) continue;
    if (dd > 7) break;
    for (const it of s.items) {
      const e = EXM[it.ex]; if (!e || e.cardio) continue;
      const k = it.sets.length;
      const x = st[e.g];
      if (dd < 7) x.week += k;
      if (dd <= 3) x.d[dd] += k;
      if (x.last === null) { x.last = s.date; x.dd = dd; }
      e.s.forEach(g => { if (!st[g]) return; if (dd < 7) st[g].week += secF(g) * k; if (dd <= 3) st[g].sec[dd] += k; });
    }
  }
  const lt = lastTrained();
  ALL_G.forEach(g => {
    const x = st[g];
    if (x.last === null && lt[g]) { x.last = lt[g]; x.dd = daysBetween(lt[g], ref); }
    const big = GN[g].size === "big";
    if (x.d[0] >= 2) x.status = "today";
    else if (x.d[1] >= 3) x.status = "tired";
    else if (x.d[1] > 0 || x.sec[0] + x.sec[1] >= 3 || (big && x.d[2] >= 8)) x.status = "partial";
    else x.status = "fresh";
  });
  return st;
}
function suggestNext(opts = {}){
  const ref = opts.ref || new Date();
  const p = S.profile;
  const rec = recovery(ref);
  const target = weeklyTargets(p);
  const dur = opts.dur || ui.customDur;
  const groups = GROUPS.filter(g => !g.opt || p.priority.includes(g.k)).map(g => {
    const x = rec[g.k];
    const def = Math.max(0, target[g.k] - x.week);
    const days = x.dd === null ? 9 : x.dd;
    const stS = {fresh:1, partial:0.35, tired:-9, today:-9}[x.status];
    const sc = stS + (def / (target[g.k] || 1)) * 1.2 + Math.min(days, 7) / 7 * 0.6 + (p.priority.includes(g.k) ? 0.3 : 0) + (g.size === "big" ? 0.15 : 0);
    return {g, x, def, days, sc};
  }).sort((a, b) => b.sc - a.sc);
  const fresh = groups.filter(c => c.x.status === "fresh");
  const freshMain = fresh.filter(c => c.g.size !== "small");
  const allMet = groups.every(c => c.def < 1);
  // ostatni trening
  const lastS = sessionsSorted().find(s => daysBetween(s.date, ref) >= 0);
  const lastDays = lastS ? daysBetween(lastS.date, ref) : null;
  const trainedDays = [1, 2].filter(o => sessionsSorted().some(s => daysBetween(s.date, ref) === o)).length;
  let rest = null;
  if (!freshMain.length) rest = "Wszystkie główne partie jeszcze się regenerują.";
  else if (trainedDays === 2 && fresh.length < 3) rest = "Dwa dni treningu z rzędu – dzień przerwy pomoże w regeneracji.";
  // wybór spójnego zestawu
  const pool = (freshMain.length ? fresh : groups.filter(c => c.x.status === "partial"));
  const W = {big:2, med:1.5, small:1};
  const wOf = c => c.g.k === "posladki" ? 1 : W[c.g.size];
  const cap = dur >= 75 ? 6.5 : dur >= 60 ? 5.5 : dur >= 45 ? 4.5 : 3;
  const out = []; let sum = 0;
  const take = c => { if (!out.includes(c) && sum + wOf(c) <= cap) { out.push(c); sum += wOf(c); } };
  if (pool.length) {
    const lead = pool.find(c => REG[c.g.k] !== "any") || pool[0];
    const R = REG[lead.g.k];
    take(lead);
    pool.filter(c => REG[c.g.k] === R).forEach(take);
    const near = R === "push" ? "pull" : R === "pull" ? "push" : "any";
    if (cap - sum >= 1.5) pool.filter(c => REG[c.g.k] === near || REG[c.g.k] === "any").forEach(take);
  }
  // sugerowane serie na partię
  const base = {big:[5,6,8], med:[4,5,6], small:[3,4,5]};
  const budget = budgetFor(dur, p.goal);
  out.forEach(c => {
    const b = base[c.g.size][p.level - 1] + (p.priority.includes(c.g.k) ? 1 : 0);
    let n = c.def >= b ? b : c.def >= 2 ? Math.max(3, Math.round(c.def)) : 3;
    if (c.x.status === "partial") n = Math.max(2, Math.round(n * 0.6));
    c.sets = n;
  });
  const tot = out.reduce((a, c) => a + c.sets, 0);
  if (tot > budget) out.forEach(c => c.sets = Math.max(2, Math.round(c.sets * budget / tot)));
  out.sort((a, b) => GROUPS.indexOf(a.g) - GROUPS.indexOf(b.g));
  const keys = out.map(c => c.g.k);
  const combo = COMBOS.find(c => c.g.length === keys.length && c.g.every(k => keys.includes(k)));
  const regs = [...new Set(keys.map(k => REG[k]).filter(r => r !== "any"))];
  const RN = {legs:"Nogi", push:"Push", pull:"Pull"};
  let title = combo ? combo.n : regs.length === 1 && keys.length >= 3 ? RN[regs[0]] + (keys.includes("brzuch") ? " + brzuch" : "") : out.map(c => c.g.short || c.g.n).join(" + ");
  return {rec, groups, pick:out, title, combo:combo ? combo.k : null,
    rest, allMet, lastS, lastDays, total:out.reduce((a, c) => a + c.sets, 0)};
}
function streakWeeks(){
  let k = 0;
  for (let o = 0; o > -104; o--) {
    const w = weekStats(o);
    if (w.list.length) k++; else if (o === 0) continue; else break;
  }
  return k;
}

const Cloud = {
  db:null, col:null, status:"local", timer:null, sent:{}, busy:false,
  async init(){
    if (!window.claude || typeof window.claude.use !== "function") { this.status = "local"; renderStatus(); return; }
    this.status = "sync"; renderStatus();
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { this.status = "local"; renderStatus(); return; }
      const id = await user.id();
      if (!id) { this.status = "local"; renderStatus(); return; }
      this.db = db; this.col = db.collection("data/users/" + id);
      const snap = await Promise.race([this.col.get(), new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), 10000))]);
      const remote = {};
      snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      const changed = mergeRemote(remote);
      Object.entries(remote).forEach(([k, v]) => this.sent[k] = JSON.stringify(v));
      if (changed) { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} render(); }
      this.status = "ok"; renderStatus();
      this.flush();
    } catch (e) { this.status = "err"; renderStatus(); }
  },
  docs(){
    const st = {settings:S.settings, profile:S.profile, plan:S.plan, user:S.user, notes:S.notes, bw:S.bw, active:S.active};
    const out = {state:JSON.parse(JSON.stringify(st))};
    for (const s of Object.values(S.sessions)) { const m = "m_" + s.date.slice(0, 7); (out[m] = out[m] || {sessions:{}}).sessions[s.id] = s; }
    return out;
  },
  schedule(){ if (!this.col) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200); },
  async flush(){
    if (!this.col || this.busy) return;
    this.busy = true;
    try {
      for (const [id, body] of Object.entries(this.docs())) {
        const js = JSON.stringify(body);
        if (this.sent[id] === js) continue;
        try { await this.col.doc(id).set(body); this.sent[id] = js; this.status = "ok"; }
        catch (e) {
          this.status = "err";
          if (e && e.code === "quota_exceeded") toast("Brak miejsca w chmurze – zrób kopię danych w zakładce Więcej.");
          if (e && (e.code === "revoked" || e.code === "not_granted")) { this.col = null; this.status = "local"; }
          break;
        }
      }
    } finally { this.busy = false; renderStatus(); }
  }
};
function mergeRemote(R){
  let changed = false;
  const st = R.state;
  if (st) {
    for (const sec of ["settings","profile","plan","active","user"]) {
      if (st[sec] && (st[sec].t || 0) > ((S[sec] && S[sec].t) || 0)) { S[sec] = st[sec]; changed = true; }
    }
    for (const [k, v] of Object.entries(st.notes || {})) if (!S.notes[k] || (v.t || 0) > (S.notes[k].t || 0)) { S.notes[k] = v; changed = true; }
    for (const [k, v] of Object.entries(st.bw || {})) if (!S.bw[k] || (v.t || 0) > (S.bw[k].t || 0)) { S.bw[k] = v; changed = true; }
  }
  for (const [k, doc] of Object.entries(R)) {
    if (!k.startsWith("m_") || !doc.sessions) continue;
    for (const [id, s] of Object.entries(doc.sessions)) if (!S.sessions[id] || (s.t || 0) > (S.sessions[id].t || 0)) { S.sessions[id] = s; changed = true; }
  }
  return changed;
}

function warmupPlan(items){

  const up = [...gs].some(g => UPPER_SET.has(g)), lo = [...gs].some(g => LOWER_SET.has(g)), core = gs.has("brzuch");

  else raise = [has("akcesoria") ? "wu_rope" : "wu_climber", "wu_inchworm"];

  const add = id => { const x = WUM[id]; if (x && !m.includes(id) && x.eq.every(has)) m.push(id); };

    add("wu_arm");

    add("wu_pullapart");
    if (gs.has("barki") || gs.has("klatka")) add("wu_extrot");
    if (gs.has("plecy")) add("wu_scap");
    if (gs.has("klatka") || gs.has("triceps")) add("wu_pushup");
  }

    add("wu_hip"); add("wu_wgs");
    if (gs.has("czworoglowe") || gs.has("posladki")) add("wu_squat");
    if (gs.has("posladki") || gs.has("dwuglowe")) add("wu_bridge");
    if (gs.has("lydki")) add("wu_ankle");

  if (core) { if (!up && !lo) add("wu_cat"); add("wu_deadbug"); }

const RT = {end:0, total:0, fired:true};
try { Object.assign(RT, JSON.parse(localStorage.getItem("seria.rest") || "{}")); } catch (e) {}
let actx = null;
function ensureAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function beep(){
  if (!S.settings.sound || !actx) return;
  try { [0, .25, .5].forEach((d, k) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = k === 2 ? 1175 : 880; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + d; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.start(t); o.stop(t + .2); }); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function startRest(sec){ RT.end = now() + sec * 1000; RT.total = sec; RT.fired = false; saveRT(); tickRest(); }
function saveRT(){ try { localStorage.setItem("seria.rest", JSON.stringify(RT)); } catch (e) {} }
function tickRest(){
  const el = $("#rest");
  if (!RT.end) { el.classList.remove("show"); return; }
  const left = (RT.end - now()) / 1000;
  if (left < -4) { RT.end = 0; saveRT(); el.classList.remove("show", "over"); return; }
  el.classList.add("show");
  $("#restT").textContent = left > 0 ? mmss(left) : "Start!";
  $("#restProg").style.width = clamp(100 - (left / RT.total) * 100, 0, 100) + "%";
  el.classList.toggle("over", left <= 0);
  if (left <= 0 && !RT.fired) { RT.fired = true; saveRT(); beep(); }
}

function sparkline(points, opts = {}){
  if (points.length < 2) return "";
  const W = 320, H = 120, P = 22;
  const ys = points.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mx - mn < 1) { mx += 1; mn -= 1; }
  const x = i => P + (i / (points.length - 1)) * (W - P * 2);
  const y = v => H - P - ((v - mn) / (mx - mn)) * (H - P * 2);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
  const last = points[points.length - 1];
  // podpisy min/max po stronie, gdzie linia ich nie zasłania
  const leftSide = (last.y - mn) < (mx - mn) * 0.35, lx = leftSide ? P : W - P, la = leftSide ? "start" : "end";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Wykres")}">
    <line class="grid" x1="${P}" x2="${W - P}" y1="${y(mx)}" y2="${y(mx)}"/><line class="grid" x1="${P}" x2="${W - P}" y1="${y(mn)}" y2="${y(mn)}"/>
    <text x="${lx}" y="${y(mx) - 5}" text-anchor="${la}">${fmt(mx, 1)}${opts.unit || ""}</text><text x="${lx}" y="${y(mn) - 5}" text-anchor="${la}">${fmt(mn, 1)}${opts.unit || ""}</text>
    <path class="ar" d="${d}L${x(points.length - 1)},${H - P}L${x(0)},${H - P}Z"/><path class="ln" d="${d}"/>
    <circle class="pt" cx="${x(points.length - 1)}" cy="${y(last.y)}" r="4.5"/>
    <text x="${P}" y="${H - 4}">${esc(points[0].l)}</text><text x="${W - P}" y="${H - 4}" text-anchor="end">${esc(last.l)}</text></svg>`;
}
function exHistory(exId){
  const out = [];

  return out;
}

/* ===================== KALKULATOR TALERZY ===================== */
function platesSheet(w){
  const bar = S.settings.bar;
  const html = weight => {
    const side = (weight - bar) / 2;
    const sizes = [25, 20, 15, 10, 5, 2.5, 1.25, 0.5];
    let left = side; const used = [];
    if (side > 0) for (const s of sizes) while (left >= s - 1e-9) { used.push(s); left -= s; }
    const vis = used.map(s => `<div class="plate p${String(s).replace(".", "_")}">${fmt(s)}</div>`).join("");
    return `<div class="plates" aria-label="Talerze na jedną stronę"><div class="sleeve"></div>${[...used].reverse().map(s => `<div class="plate p${String(s).replace(".", "_")}">${fmt(s)}</div>`).join("")}<div class="collar"></div><div class="sleeve" style="width:70px"></div><div class="collar"></div>${vis}<div class="sleeve"></div></div>
      <p class="small" style="text-align:center">${weight <= bar ? `Sama sztanga (${fmt(bar)} kg)` : `Na każdą stronę: <b class="num">${used.length ? used.map(fmt).join(" + ") : "–"}</b> kg`}${left > 0.01 ? `<br><span class="muted">Nie da się dokładnie: brakuje ${fmt(left * 2)} kg</span>` : ""}</p>`;
  };
  openSheet(sheetHead("Kalkulator talerzy", `Sztanga ${fmt(bar)} kg · kolory jak na zawodach`) + `<div class="field"><label for="plw">Ciężar całkowity (kg)</label><input class="inp num" id="plw" inputmode="decimal" value="${w ? fmt(w) : ""}" placeholder="np. 80"></div><div id="plout">${html(w || bar)}</div>`);
  $("#plw").addEventListener("input", ev => { const v = num(ev.target.value); $("#plout").innerHTML = html(v && v > 0 ? v : bar); });
}

};

function bwList(){ return Object.entries(S.bw).filter(([, v]) => v && v.kg).sort((a, b) => a[0].localeCompare(b[0])); }

// Mifflin-St Jeor × współczynnik aktywności, cel wg tempa zmiany masy ciała
function nutrition(u, p, w){
  u = u || S.user; p = p || S.profile; w = w || curWeight() || u.weight;
  const h = u.height, a = u.age, f = u.sex === "f";
  const bmr = 10 * w + 6.25 * h - 5 * a + (f ? -161 : 5);
  const nd = p.weekdays.length;
  const pal = Math.min(1.95, (ACTS[u.activity] || ACTS.light).f + 0.03 * nd * (p.duration / 60) + (p.cardio ? 0.012 * nd : 0));
  const tdee = bmr * pal;
  const hm = h / 100, bmi = w / (hm * hm);
  const notes = [];
  const lvl = p.level || 2;
  const goal = u.goal;
  const minor = a < 18;
  let delta = 0;
  if (minor) notes.push("Przed 18. rokiem życia nie liczę deficytu ani nadwyżki: organizm jeszcze rośnie i potrzebuje pełnej energii. Pokazuję kalorie na utrzymanie. Jeśli chcesz schudnąć albo przytyć, porozmawiaj z lekarzem lub dietetykiem.");
  else if (goal === "masa") {
    const r = [0.004, 0.0025, 0.0015][lvl - 1] * w;
    delta = clamp(r * 7700 / 7, 100, 400);
    if (bmi >= 30) notes.push("Przy BMI powyżej 30 zwykle lepiej zacząć od celu „Schudnąć i zbudować mięśnie”: mięśnie i tak urosną, a ubędzie tłuszczu.");
  } else if (goal === "redukcja" || goal === "rekompozycja") {
    if (bmi < 18.5) notes.push(`BMI ${fmt(bmi, 1)} jest poniżej normy (18,5), więc nie liczę deficytu, tylko kalorie na utrzymanie. Lepszym celem będzie budowa mięśni. W razie wątpliwości porozmawiaj z lekarzem.`);
    else if (goal === "redukcja") { const pct = bmi >= 30 ? 0.009 : bmi < 23 ? 0.005 : 0.007; delta = -Math.min(Math.min(pct * w, 1) * 7700 / 7, tdee * 0.25); }
    else delta = -clamp(tdee * 0.1, 150, 350);
  } else if (goal === "sila") delta = Math.min(tdee * 0.05, 200);

  kcal = r10(kcal);
  const tdeeR = r10(tdee);
  const diff = kcal - tdeeR;
  const rate = minor ? 0 : diff * 7 / 7700;
  const refW = bmi > 25 ? 25 * hm * hm : w;
  const prot = Math.round((PROT_KG[goal] || 1.8) * refW / 5) * 5;
  const fat = Math.round(Math.max(kcal * 0.25 / 9, 0.7 * refW) / 5) * 5;
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4 / 5) * 5);
  const water = Math.min(4.5, Math.round(w * 0.035 * 10) / 10);
  const fiber = Math.round(kcal / 1000 * 14);
  const steps = goal === "redukcja" || goal === "zdrowie" ? "8–10 tys." : "7–10 tys.";
  let weeks = null;
  if (u.target && Math.abs(rate) > 0.02 && (u.target - w) * rate > 0) weeks = Math.ceil(Math.abs(u.target - w) / Math.abs(rate));
  if (!minor && u.target && u.target / (hm * hm) < 18.5) notes.push(`Waga docelowa ${fmt(u.target, 1)} kg to BMI poniżej 18,5 (niedowaga). Rozważ wyższy cel.`);

  return {bmr, pal, tdee:tdeeR, delta:diff, kcal, rate, prot, fat, carb, water, fiber, steps, bmi, refW, notes, weeks, minor, floored, floor, w, adj, pk:PROT_KG[goal] || 1.8};
}
// trend wagi z regresji liniowej (min. 4 pomiary w ciągu 10+ dni)
function weightTrend(since){
  const cut = new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate() - 28);
  const pts = bwList().filter(([k]) => dOf(k) >= cut && (!since || k > since));
  if (pts.length < 4) return null;
  const x0 = dOf(pts[0][0]);
  const xs = pts.map(([k]) => Math.round((dOf(k) - x0) / 864e5)), ys = pts.map(([, v]) => v.kg);
  const span = xs[xs.length - 1]; if (span < 10) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length;
  let num_ = 0, den = 0; xs.forEach((x, i) => { num_ += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  return {perWeek:den ? num_ / den * 7 : 0, n:pts.length, span};
}
function kcalAdvice(n){
  if (!n || n.minor) return null;
  const tr = weightTrend(S.user.adjAt);
  if (!tr) return {tr:null};
  const diff = tr.perWeek - n.rate;
  let corr = Math.round(clamp(-diff * 7700 / 7, -300, 300) / 50) * 50;
  if (Math.abs(corr) < 100) corr = 0;
  if (corr < 0 && n.floored) corr = 0;
  if (corr < 0 && n.kcal + corr < n.floor) corr = Math.min(0, Math.ceil((n.floor - n.kcal) / 50) * 50);
  if (Math.abs(corr) < 100) corr = 0;
  return {tr, diff, corr};
}

function md(t){
  const lines = esc(t).split(/\n/);
  let html = "", list = false, para = [];
  const flush = () => { if (para.length) { html += `<p>${para.join("<br>")}</p>`; para = []; } };
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { flush(); if (!list) { html += "<ul>"; list = true; } html += `<li>${m[1]}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (!l.trim()) { flush(); continue; }
    para.push(l.replace(/^#{1,4}\s*/, ""));
  }
  flush(); if (list) html += "</ul>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

function aiInput(){
  const out = [];
  for (const m of AI.msgs.filter(m => !m.err).slice(-12)) {
    if (out.length && out[out.length - 1].role === m.role) out[out.length - 1].content += "\n\n" + m.content;
    else out.push({role:m.role, content:m.content});
  }
  while (out.length && out[0].role !== "user") out.shift();
  if (!out.length) return [];
  out[0] = {role:"user", content:aiContext() + "\n\n---\nWiadomość użytkownika:\n" + out[0].content};
  return out;
}

    if (code === "not_granted") AI.state = "denied";
    AI.msgs.push({role:"assistant", content:(e && e.text ? e.text + "\n\n" : "") + msg, err:true, act:AI.setWorkout ? "custom" : undefined});

  const prs = [];
  items.forEach(it => { const e = EXM[it.ex]; if (!e || e.cardio) return; const prev = bestOf(it.ex); let bestNow = null; it.sets.forEach(st => { const v = e && (e.time || (e.bw && !st.w)) ? (st.r || 0) : e1rm(st.w, st.r); if (v && (!bestNow || v > bestNow.v)) bestNow = {v, w:st.w, r:st.r}; }); if (bestNow && prev && bestNow.v > prev.v + 1e-6) prs.push({ex:it.ex, ...bestNow}); });

  S.sessions[s.id] = s;
  items.forEach(it => { const e = EXM[it.ex]; if (!e || e.cardio) return; const top = Math.max(0, ...it.sets.map(x => x.w || 0)); if (top || (e && e.bw)) { const topSet = it.sets.find(x => (x.w || 0) === top); S.notes[it.ex] = {...(S.notes[it.ex] || {}), w:top || (S.notes[it.ex] && S.notes[it.ex].w) || null, r:topSet && topSet.r ? String(topSet.r) : "", t:now()}; } });

  persist(); render();

  openSheet(sheetHead("Trening zapisany", esc(s.title)) + `<div class="sum-big"><div><b class="num">${s.dur}</b><span class="small muted">${plural(s.dur, ["minuta","minuty","minut"])}</span></div><div><b class="num">${nsets}</b><span class="small muted">${plural(nsets, ["seria","serie","serii"])}</span></div><div><b class="num">${vol >= 10000 ? fmt(vol / 1000, 1) + "t" : fmtInt(vol)}</b><span class="small muted">${vol >= 10000 ? "ton" : "kg"} objętości</span></div></div>
    ${prs.length ? `<div class="stack"><h3>Nowe rekordy</h3>${prs.map(p => { const e = EXM[p.ex]; return `<div class="pr">${ic("trophy")}<span class="grow"><b>${esc(e.n)}</b><br><span class="small num">${p.w ? fmt(p.w) + " kg × " + p.r + " (szac. 1RM " + fmt(p.v, 1) + " kg)" : p.r + (e.time ? " s" : " powt.")}</span></span></div>`; }).join("")}</div>` : `<p class="small muted">Ciężary zapisały się przy ćwiczeniach i zostaną podpowiedziane na następnym treningu.</p>`}

}

  if (S.custom && S.custom.combo) ui.combo = S.custom.combo;
  if (S.user === undefined) S.user = null;
  const h = tabOf(location.hash.slice(1));
  if (h) { ui.tab = h; setHash(h); }
  applyTheme(); render(); tickRest();
  aiInit();
  // wprowadzenie pokazujemy po wczytaniu danych z chmury (żeby nie pytać drugi raz na nowym urządzeniu)
  Cloud.init().finally(() => { if (!S.user && !S.active.s) obOpen(true); });
  // GitHub Pages: tryb offline i instalacja na ekranie początkowym
  if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
})();
</script>
